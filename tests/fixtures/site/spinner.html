<!doctype html><html><head><title>Spinner Fixture</title>
<style>body{font:20px sans-serif;margin:0} .spinner{position:fixed;left:600px;top:320px;width:60px;height:60px;border:6px solid #ccc;border-top-color:#333;border-radius:50%;animation:spin .8s linear infinite} @keyframes spin{to{transform:rotate(360deg)}}
#cta{position:absolute;left:100px;top:200px;width:200px;height:60px;margin:0;padding:0;border:0;background:#222;color:#fff;font-size:18px}</style></head>
<body><div class="spinner" id="sp"></div><div id="app" style="display:none"><h1 style="margin:20px">Loaded</h1><button id="cta" onclick="this.textContent='Done!'">Get started</button></div>
<script>setTimeout(()=>{document.getElementById('sp').remove();document.getElementById('app').style.display='block'},3000)</script></body></html>
